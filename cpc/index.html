<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>CPC Feature Explainers (Senad Version)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap">
<style>
/* Layout: a 2x2 wall of solid neon tiles on black; each opens a single-stage player (diagram, one headline, one sentence). */
:root{
  /* Confluent-aligned: near-black indigo ground, Confluent purple as the brand accent.
     Token roles: --pink = problem (coral), --orange = infrastructure (sky), --yellow = solution (lavender). */
  --bg:#f5f4f4; --ink:#ffffff; --panel:#ffffff; --panel-hover:#f3f1ff; --brand:#5c48f6;
  --pink:#c8363d; --orange:#0b7fab; --yellow:#5341e6;
  --text:#1e1d22; --soft:#5f5d67; --dim:#77757f; --line:#dcdae3; --logo:#173361;
  --display:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0c18; --ink:#0d0c18; --panel:#17152a; --panel-hover:#1d1a38; --pink:#ff7a7a; --orange:#5cc8f0; --yellow:#a99cff; --text:#f3f2f8; --soft:#c9c7d6; --dim:#8e8c99; --line:#2e2c42; --logo:#ffffff; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0c18; --ink:#0d0c18; --panel:#17152a; --panel-hover:#1d1a38; --pink:#ff7a7a; --orange:#5cc8f0; --yellow:#a99cff; --text:#f3f2f8; --soft:#c9c7d6; --dim:#8e8c99; --line:#2e2c42; --logo:#ffffff; color-scheme:dark}
.top-r{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px}
.logo{height:30px;width:auto;max-width:60%;color:var(--logo)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{width:100%;max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--text);outline-offset:3px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);margin:0}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,54px);line-height:1.05;margin:0;text-wrap:balance;color:var(--text)}
.lede{margin:0;max-width:60ch;font-size:19px}
.head{display:flex;flex-direction:column;gap:12px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.tile{border:1.5px solid var(--line);border-radius:16px;padding:28px;min-height:270px;text-align:left;
  display:flex;flex-direction:column;justify-content:space-between;gap:24px;color:var(--text);background:var(--panel);
  transition:transform .18s ease,border-color .18s ease,background .18s ease}
.tile:hover,.tile:focus-visible{transform:translateY(-3px);border-color:var(--brand);background:var(--panel-hover)}
.tile svg{color:var(--yellow)}
.t-wide{grid-column:1/-1;min-height:200px}
.t-wide .tile-hook{max-width:60ch}
.tile-go{background:var(--brand);border-color:var(--brand) !important;color:#fff}
h1,.fname,.cap h2,.tile-name{letter-spacing:-.02em}
.tile-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.tile svg{width:132px;height:77px;flex:none}
.tile-name{font-family:var(--display);font-weight:800;font-size:clamp(22px,3.1vw,36px);line-height:1.08;margin:0;text-wrap:balance}
.tile-hook{margin:8px 0 0;font-size:18px;font-weight:400;max-width:36ch;color:var(--soft)}
.tile-go{font-weight:700;font-size:14px;letter-spacing:.08em;text-transform:uppercase;border:2.5px solid currentColor;border-radius:999px;padding:6px 14px;white-space:nowrap}

/* player */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px}
.back{background:none;border:2.5px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:700}
.back:hover{border-color:var(--text)}
.fname{font-family:var(--display);font-weight:800;font-size:clamp(20px,3vw,30px);color:var(--acc);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:none;border:2.5px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:700;font-size:15px}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--ink)}
.stage{background:var(--ink);border:2.5px solid var(--line);border-radius:22px;overflow-x:auto;position:relative}
.stage svg{display:block;width:100%;min-width:640px;max-height:48vh;font-family:var(--body)}
.tag{align-self:flex-start;font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;border-radius:8px;padding:8px 14px;border:2.5px solid transparent}
.tag-wo{background:var(--pink);color:var(--ink)}
.tag-wi{background:var(--yellow);color:var(--ink)}
.tag-vs{border-color:var(--text)}
.tag-kb{border-color:var(--dim);color:var(--dim)}
.stage.wo{border-color:var(--pink)}.stage.wi{border-color:var(--yellow)}
.dots button.wo{border-color:var(--pink)}.dots button.wo[aria-current="true"]{background:var(--pink)}
.prog{height:5px;background:var(--line)}
.prog i{display:block;height:100%;width:0;background:var(--acc);animation:prog 10s linear forwards}
.paused .prog i{animation-play-state:paused}
.cap{display:flex;flex-direction:column;gap:8px;min-height:7.5em}
.cap h2{font-family:var(--display);font-weight:600;font-size:clamp(20px,2.8vw,30px);line-height:1.15;margin:0;text-wrap:balance;color:var(--text)}
.cap p{margin:0;font-size:19px;max-width:66ch}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.ctl button{background:none;border:2.5px solid var(--acc);border-radius:999px;padding:9px 20px;font-weight:700}
.ctl button:hover:not(:disabled){background:var(--acc);color:var(--ink)}
.ctl button:disabled{border-color:var(--line);color:var(--dim);cursor:default}
.dots{display:flex;gap:8px;align-items:center}
.dots button{width:14px;height:14px;padding:0;border-radius:50%;border:2.5px solid var(--acc)}
.dots button[aria-current="true"]{background:var(--acc)}
.ask{border-top:2.5px solid var(--line);padding-top:20px;display:flex;flex-direction:column;gap:6px}
.ask q{font-family:var(--display);font-weight:600;font-size:clamp(17px,2.2vw,22px);color:var(--acc);quotes:none;text-wrap:balance}

/* diagram motion */
.fly{opacity:0;animation:fly linear infinite}
.pa{animation:phA 8s infinite}.pb{animation:phB 8s infinite}
.blink{animation:blink 1.4s ease-in-out infinite}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.popl{transform-box:fill-box;transform-origin:center;animation:popl 4s ease-in-out infinite}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow 6s ease-in-out infinite}
.breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3s ease-in-out infinite alternate}
.capd{animation:capd 6s ease-in-out infinite}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 3s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fly{0%{transform:translate(0,0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
@keyframes phA{0%,42%{opacity:1}50%,92%{opacity:0}100%{opacity:1}}
@keyframes phB{0%,42%{opacity:0}50%,92%{opacity:1}100%{opacity:0}}
@keyframes blink{50%{opacity:.25}}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes popl{0%,20%{transform:scale(.5);opacity:0}35%,90%{transform:scale(1);opacity:1}100%{transform:scale(.5);opacity:0}}
@keyframes grow{0%{transform:scaleY(.35)}35%,75%{transform:scaleY(1)}100%{transform:scaleY(.35)}}
@keyframes breathe{from{transform:scaleY(.9)}to{transform:scaleY(1)}}
@keyframes capd{0%,32%{opacity:0}40%,75%{opacity:1}85%,100%{opacity:0}}
@keyframes prog{to{width:100%}}
@media (prefers-reduced-motion:reduce){
  .fly,.blink,.pop,.popl,.grow,.breathe,.capd{animation:none}
  .pa{animation:none;opacity:0}.pb{animation:none;opacity:1}
  .draw{animation:none;stroke-dashoffset:0}
  .prog i{animation:none}.tile{transition:none}
}
@media (max-width:720px){.tiles{grid-template-columns:1fr}.tile{min-height:220px}}
</style>

<div class="wrap">
  <div class="top"><svg class="logo" viewBox="0 0 212 41" role="img" aria-label="Confluent" fill="currentColor"><path d="M62.065 22.19H64c-.755 3.472-3.705 5.81-7.646 5.81C51.728 28 48 24.55 48 19.989 48 15.427 51.728 12 56.354 12c3.94 0 6.89 2.315 7.646 5.787h-1.935c-.661-2.519-2.785-4.107-5.71-4.107-3.635 0-6.467 2.7-6.467 6.309s2.832 6.332 6.466 6.332c2.926 0 5.05-1.635 5.71-4.131M84 20c0 4.455-3.57 8-8 8s-8-3.545-8-8 3.57-8 8-8 8 3.545 8 8m-1.808 0c0-3.5-2.711-6.318-6.192-6.318-3.48 0-6.192 2.818-6.192 6.318S72.52 26.318 76 26.318 82.192 23.5 82.192 20M103 12v16h-1.48l-9.75-12.612V28H90V12h1.435l9.794 12.777V12zm8.86 1.718V19.6h8.15v1.717h-8.15V28H110V12h11v1.718zM138 26.282V28h-11V12h1.914v14.282zm17-5.288c0 4.185-2.79 7.006-7 7.006s-7-2.82-7-7.006V12h1.9v8.994c0 3.075 2.02 5.295 5.1 5.295 3.055 0 5.1-2.22 5.1-5.295V12h1.9zm8.826-7.276V19.2h8.25v1.718h-8.25v5.365H173V28h-11V12h11v1.718zM191 12v16h-1.48l-9.75-12.612V28H178V12h1.435l9.794 12.777V12zm19 1.718h-5.626V28h-1.77V13.718H197V12h13zM26.375 20.975c.875-.047 1.75-.075 2.625-.139v-.672c-.875-.064-1.75-.092-2.625-.14l-2.625-.081c-1.54-.047-3.08-.06-4.622-.07a188 188 0 0 0-.051-4.623l-.074-2.625c-.045-.875-.07-1.75-.132-2.625h-.742c-.062.875-.087 1.75-.132 2.625l-.073 2.625c-.02.723-.029 1.447-.036 2.17-.285-.665-.57-1.33-.865-1.991l-1.072-2.397c-.377-.79-.735-1.59-1.127-2.375l-.684.285c.277.831.589 1.65.882 2.475l.937 2.454c.258.675.526 1.346.796 2.018a130 130 0 0 0-1.56-1.509l-1.908-1.804c-.65-.587-1.287-1.188-1.95-1.763l-.523.524c.574.663 1.175 1.3 1.762 1.95l1.804 1.908q.749.786 1.509 1.56c-.672-.27-1.343-.538-2.019-.796l-2.453-.937c-.825-.293-1.644-.605-2.476-.883l-.284.685c.785.392 1.584.75 2.375 1.127l2.397 1.072c.66.295 1.325.58 1.99.864-.723.008-1.446.017-2.17.036l-2.624.074c-.875.045-1.75.07-2.625.132v.742c.875.062 1.75.087 2.625.132l2.625.073c1.542.042 3.083.049 4.624.052.01 1.54.022 3.081.069 4.622l.082 2.625c.047.875.075 1.75.139 2.625h.672c.064-.875.092-1.75.14-2.625l.081-2.625c.023-.741.035-1.482.046-2.223q.436 1.022.892 2.037l1.08 2.393c.378.79.738 1.588 1.133 2.373l.62-.259c-.275-.832-.583-1.651-.875-2.478l-.93-2.455q-.395-1.04-.808-2.072.794.777 1.604 1.54l1.913 1.799c.652.585 1.29 1.184 1.955 1.758l.476-.476c-.574-.664-1.173-1.303-1.758-1.955l-1.799-1.914a132 132 0 0 0-1.539-1.603q1.031.413 2.07.809l2.457.929c.826.292 1.645.6 2.478.876l.258-.622c-.785-.393-1.582-.755-2.373-1.133l-2.393-1.08c-.676-.304-1.356-.598-2.036-.892.74-.01 1.481-.022 2.222-.045z"/><path d="M19 37C9.626 37 2 29.374 2 20S9.626 3 19 3s17 7.626 17 17-7.626 17-17 17m0-32.41C10.503 4.59 3.59 11.502 3.59 20S10.503 35.41 19 35.41 34.41 28.497 34.41 20 27.497 4.59 19 4.59"/></svg><div class="top-r"><button class="back" id="dl" type="button" hidden>Download MP4</button><button class="back" id="theme" type="button">Dark theme</button></div></div>
  <section id="home" class="wrap">
    <div class="head">
      <p class="eyebrow">Confluent Private Cloud</p>
      <h1>Four reasons to look again at your Kafka</h1>
      <p class="lede">Start with Motivation, the business case in plain language. Then pick a feature tile for the technical animation you can talk over with an architect.</p>
    </div>
    <div class="tiles" id="tiles"></div>
  </section>

  <section id="play" class="wrap" hidden>
    <div class="bar">
      <button class="back" id="back" type="button">&larr; All features</button>
      <p class="fname" id="fname"></p>
    </div>
    <div class="chips" id="chips"></div>
    <div class="tag" id="tag"></div>
    <div class="stage" id="stage"></div>
    <div class="cap" aria-live="polite"><h2 id="ch"></h2><p id="cp"></p></div>
    <div class="ctl">
      <button id="prev" type="button">&larr; Back</button>
      <div class="dots" id="dots"></div>
      <button id="next" type="button">Next &rarr;</button>
      <button id="pp" type="button">Pause</button>
    </div>
    <div class="ask"><p class="eyebrow">Ask your customer</p><q id="ask"></q></div>
  </section>
</div>

<script>
const P='var(--pink)',O='var(--orange)',Y='var(--yellow)',T='var(--text)',D='var(--dim)',K='var(--ink)';
const t=(x,y,s,c=T,z=16,a='middle',w=700,ex='')=>`<text x="${x}" y="${y}" fill="${c}" font-size="${z}" text-anchor="${a}" font-weight="${w}" ${ex}>${s}</text>`;
const box=(x,y,w,h,c,label,sub,dash,z=16)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="12" fill="${K}" stroke="${c}" stroke-width="2.5" ${dash?'stroke-dasharray="7 6"':''}/>`
  +(label?t(x+w/2,y+h/2+(sub?-3:6),label,c,z):'')+(sub?t(x+w/2,y+h/2+17,sub,D,13,'middle',600):'');
const ln=(x1,y1,x2,y2,c=D,dash)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="2" ${dash?'stroke-dasharray="6 6"':''}/>`;
const mv=(x1,y1,x2,y2,dur,delay)=>`style="--dx:${x2-x1}px;--dy:${y2-y1}px;animation-duration:${dur}s;animation-delay:${delay}s"`;
const fly=(x1,y1,x2,y2,c=Y,dur=2.4,delay=0,r=7)=>`<circle class="fly" cx="${x1}" cy="${y1}" r="${r}" fill="${c}" ${mv(x1,y1,x2,y2,dur,delay)}/>`;
const flyT=(x1,y1,x2,y2,s,c,dur,delay)=>`<text class="fly" x="${x1}" y="${y1+6}" fill="${c}" font-size="20" font-weight="800" text-anchor="middle" ${mv(x1,y1,x2,y2,dur,delay)}>${s}</text>`;
const g=(cls,inner)=>`<g class="${cls}">${inner}</g>`;
const key=(x,y,c)=>`<g transform="translate(${x},${y})" fill="none" stroke="${c}" stroke-width="3.5" stroke-linecap="round"><circle r="7"/><path d="M7 0h20M20 0v8M27 0v6"/></g>`;
const lock=(x,y,c)=>`<g transform="translate(${x},${y})"><rect x="-9" y="-2" width="18" height="14" rx="3" fill="${c}"/><path d="M-5 -2v-5a5 5 0 0 1 10 0v5" fill="none" stroke="${c}" stroke-width="3"/></g>`;
const gauge=(x,y,w,f,c)=>`<rect x="${x}" y="${y}" width="${w}" height="9" rx="4.5" fill="${K}" stroke="${D}" stroke-width="1.5"/><rect x="${x}" y="${y}" width="${w*f}" height="9" rx="4.5" fill="${c}"/>`;
const card=(x,y,w,rows)=>`<rect x="${x}" y="${y}" width="${w}" height="${rows.length*26+20}" rx="10" fill="${K}" stroke="${D}" stroke-width="2"/>`
  +rows.map((r,i)=>t(x+14,y+31+i*26,r[0],r[1]||T,15,'start',600,'font-family="var(--mono)"')).join('');
const SCR='card: x9$Kq#72%Lm', CLR='card: 4111 1111 1111 1111';

/* ---------- Gateway ---------- */
const AY=[93,200,307], AN=['Orders app','Payments app','Mobile app'];
const apps=(c=T)=>AY.map((y,i)=>box(40,y-23,130,46,c,AN[i],'',0,15)).join('');
const under=(s,c,cls='')=>AY.map(y=>`<g class="${cls}">${t(105,y+41,s,c,13)}</g>`).join('');
const toGw=()=>AY.map((y,i)=>ln(170,y,330,200)+fly(170,y,330,200,Y,2.4,i*.8)).join('');
const GW=box(330,110,140,180,Y,'Gateway');
const flip=(a,b)=>g('pa',ln(470,200,620,105,O)+fly(470,200,620,105,O,1.6,0)+fly(470,200,620,105,O,1.6,.8)+t(400,325,a,O,14))
  +g('pb',ln(470,200,620,295,Y)+fly(470,200,620,295,Y,1.6,0)+fly(470,200,620,295,Y,1.6,.8)+t(400,325,b,Y,14));
const A4=[60,150,240,330], C3=[80,195,310];
const apps4=()=>A4.map((y,i)=>box(40,y-20,130,40,T,'App '+(i+1),'',0,15)).join('');
const cl3=()=>C3.map((y,i)=>box(620,y-40,150,80,O,'Cluster '+'ABC'[i])).join('');

const gateway=[
 {name:'Move clusters',steps:[
  {h:'Today, apps are wired straight to a cluster',p:'Upgrade, move or replace that cluster and every team has to change and redeploy their app. Migrations drag on for months.',
   svg:()=>AY.map((y,i)=>ln(170,y,620,105)+fly(170,y,620,105,Y,2.6,i*.8)).join('')+apps()+box(620,60,150,90,O,'Old cluster')+box(620,250,150,90,Y,'New cluster','waiting',1)+under('change + redeploy',P,'blink')},
  {h:'With Gateway, you switch once in the middle',p:'Apps talk to the Gateway. You repoint the Gateway to the new cluster and the apps carry on, untouched.',
   svg:()=>toGw()+flip('Sending to old cluster','Switched to new cluster')+apps()+GW+box(620,60,150,90,O,'Old cluster')+box(620,250,150,90,Y,'New cluster')+under('no change',Y)}]},
 {name:'Survive an outage',steps:[
  {h:'A site goes down and every app is stuck',p:'The standby site is ready, but each app still points at the failed one. Recovery means chasing every team in the middle of the night.',
   svg:()=>AY.map(y=>ln(170,y,620,105,P,1)).join('')+apps()+box(620,60,150,90,P,'Primary site','down')+box(620,250,150,90,O,'Standby site','idle')+under('connection lost',P,'blink')},
  {h:'Gateway sends traffic to the standby',p:'Apps keep the same address. The Gateway redirects them to the healthy site, so failover is one action instead of hundreds.',
   svg:()=>toGw()+ln(695,150,695,250,D,1)+fly(695,150,695,250,O,2,0,5)+t(683,205,'kept in sync',D,13,'end')+flip('Primary site healthy','Failed over to standby')+apps()+GW+box(620,60,150,90,O,'Primary site')+box(620,250,150,90,Y,'Standby site')
     +g('pb',`<path d="M650 75l90 60M740 75l-90 60" stroke="${P}" stroke-width="5" stroke-linecap="round"/>`)+under('same address',Y)}]},
 {name:'One front door',steps:[
  {h:'Many clusters, many addresses',p:'Every app has to know which cluster it uses and where it lives. Each new cluster adds more wiring to manage and secure.',
   svg:()=>A4.map(a=>C3.map(c=>ln(170,a,620,c,P)).join('')).join('')+apps4()+cl3()},
  {h:'One address that every team remembers',p:'Apps connect to a single name. The Gateway routes each one to the right cluster behind it, and the clusters stay hidden from the network.',
   svg:()=>A4.map((y,i)=>ln(170,y,330,200)+fly(170,y,330,200,Y,2.4,i*.6)).join('')+C3.map((y,i)=>ln(470,200,620,y,O)+fly(470,200,620,y,O,1.8,i*.6)).join('')+apps4()+GW+cl3()
     +`<rect x="300" y="52" width="200" height="34" rx="17" fill="${Y}"/>`+t(400,75,'kafka.example.com',K,15)}]},
 {name:'Safer sign-in',steps:[
  {h:'Cluster secrets end up in every app',p:'Each team stores the cluster’s credentials in its own code and config. Rotating them means touching every app again.',
   svg:()=>AY.map((y,i)=>ln(170,y,620,200)+fly(170,y,620,200,P,2.6,i*.8)+key(186,y-22,P)).join('')+apps()+box(620,150,150,100,O,'Kafka cluster')+t(400,372,'The same secret, copied into every app',P,15)},
  {h:'Apps sign in the way they already do',p:'Apps use their existing company identity. The Gateway swaps it for the cluster’s credentials, which stay in one place.',

 replication:`<svg viewBox="0 0 120 70" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" aria-hidden="true"><path d="M60 16L22 54M60 16l38 38"/><circle cx="60" cy="14" r="11" fill="currentColor"/><circle cx="22" cy="54" r="10" fill="currentColor"/><circle cx="98" cy="54" r="10" fill="currentColor"/><circle cx="41" cy="35" r="4" fill="currentColor"/><circle cx="79" cy="35" r="4" fill="currentColor"/></svg>`,
 csfle:`<svg viewBox="0 0 120 70" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" aria-hidden="true"><path d="M6 20h30M6 36h22M6 52h30M92 36h22M84 20h30M84 52h30"/><rect x="42" y="30" width="36" height="30" rx="6" fill="currentColor" stroke="none"/><path d="M50 30v-9a10 10 0 0 1 20 0v9"/></svg>`
};
const F={
 motivation:{name:'Motivation',tile:'t-a t-wide',acc:Y,hook:'Start with the business case: outages, control, separation, always-on. Then go technical.',tracks:mo,cpc:'CPC',tags:mo.map(()=>['wo','wi']),
   ask:'Which would hurt most today: a cloud outage, a lost sign-in service, or a pause in a system that must never stop?'},
 gateway:{name:'CPC Gateway',tile:'t-a',acc:Y,hook:'Move, protect and simplify Kafka without touching a single app.',tracks:gateway,cpc:'CPC',tags:[['wo','wi'],['wo','wi'],['wo','wi'],['wo','wi']],
   ask:'What happens to your application teams when you need to move or upgrade a Kafka cluster?'},
 'multi-tenancy':{name:'CPC Multi-Tenancy',tile:'t-a',acc:Y,hook:'One shared cluster. A private Kafka for every team.',tracks:mt,cpc:'CPC',tags:[['wo','wi','wi','wi','wi','vs']],
   ask:'How many Kafka clusters do you run today, and how busy is the average one?'},
 replication:{name:'Intelligent Replication',tile:'t-a',acc:Y,hook:'Push-based replication that needs fewer brokers and keeps latency steady.',tracks:ir,cpc:'CPC',tags:[['kb','wo','wi','wi','vs','vs']],
   ask:'How much of your Kafka hardware is headroom you pay for but cannot use?'},
 csfle:{name:'CSFLE',tile:'t-a',acc:Y,hook:'Client-side field level encryption. Sensitive fields stay locked, even inside Kafka.',tracks:cs,cpc:'CSFLE',tags:[['wo','wi','wi','wi']],
   ask:'Who can read a card number today once it lands in a Kafka topic?'}
};

const $=id=>document.getElementById(id);
const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
let cur=null,tr=0,st=0,playing=!still;

$('tiles').innerHTML=Object.entries(F).map(([id,f])=>`<button class="tile ${f.tile}" type="button" data-id="${id}">
  <span class="tile-top">${ico[id]}<span class="tile-go">Play &#9654;</span></span>
  <span><span class="tile-name" style="display:block">${f.name}</span><span class="tile-hook" style="display:block">${f.hook}</span></span></button>`).join('');
$('tiles').addEventListener('click',e=>{const b=e.target.closest('.tile');if(b)location.hash=b.dataset.id});

function route(){
  const id=location.hash.slice(1);
  if(F[id]){if(cur!==id){cur=id;tr=0;st=0;playing=!still}render();$('back').focus({preventScroll:true});scrollTo(0,0)}
  else{cur=null;$('play').hidden=true;$('home').hidden=false}
}
function render(){
  const f=F[cur],track=f.tracks[tr],s=track.steps[st];
  $('home').hidden=true;$('play').hidden=false;$('play').style.setProperty('--acc',f.acc);
  $('fname').textContent=f.name;
  $('chips').hidden=f.tracks.length<2;
  $('chips').innerHTML=f.tracks.map((k,i)=>`<button class="chip" type="button" data-i="${i}" aria-pressed="${i===tr}">${k.name}</button>`).join('');
  $('stage').innerHTML=`<svg viewBox="0 0 800 400" role="img" aria-label="${s.h}">${s.svg()}</svg><div class="prog"><i></i></div>`;
  $('stage').querySelector('.prog i').addEventListener('animationend',()=>{if(playing&&!atEnd())go(1)});
  const tg=f.tags[tr][st];$('tag').className='tag tag-'+tg;
  $('tag').textContent={wo:'Without '+f.cpc,wi:'With '+f.cpc,vs:'Without '+f.cpc+' vs with '+f.cpc,kb:'Kafka basics'}[tg];
  $('stage').classList.add(tg);
  $('ch').textContent=s.h;$('cp').textContent=s.p;$('ask').textContent=f.ask;
  $('dots').innerHTML=track.steps.map((_,i)=>`<button type="button" class="${f.tags[tr][i]}" data-i="${i}" aria-label="Step ${i+1}" aria-current="${i===st}"></button>`).join('');
  $('prev').disabled=tr===0&&st===0;$('next').disabled=atEnd();
  $('next').innerHTML=(st===track.steps.length-1&&!atEnd())?'Next use case &rarr;':'Next &rarr;';
  setPlay();
}
const atEnd=()=>{const f=F[cur];return tr===f.tracks.length-1&&st===f.tracks[tr].steps.length-1};
function setPlay(){$('play').classList.toggle('paused',!playing);$('pp').textContent=playing?'Pause':'Play'}
function go(d){
  const f=F[cur];st+=d;
  if(st>=f.tracks[tr].steps.length){if(tr<f.tracks.length-1){tr++;st=0}else st--}
  if(st<0){if(tr>0){tr--;st=f.tracks[tr].steps.length-1}else st=0}
  render();
}
$('next').onclick=()=>go(1);$('prev').onclick=()=>go(-1);
$('pp').onclick=()=>{playing=!playing;setPlay()};
$('back').onclick=()=>{location.hash='home'};
$('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(b){tr=+b.dataset.i;st=0;render()}});
$('dots').addEventListener('click',e=>{const b=e.target.closest('button');if(b){st=+b.dataset.i;render()}});
addEventListener('keydown',e=>{if(!cur)return;
  if(e.key==='ArrowRight'&&!atEnd())go(1);else if(e.key==='ArrowLeft')go(-1);else if(e.key==='Escape')location.hash='home'});
const root=document.documentElement;
const isDark=()=>root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
const themeLabel=()=>{$('theme').textContent=isDark()?'Light theme':'Dark theme'};
$('theme').onclick=()=>{root.dataset.theme=isDark()?'light':'dark';themeLabel()};themeLabel();
(async()=>{
  const d=await window.claude?.use?.('downloads');if(!d)return;
  const b=$('dl'),lab=b.textContent;b.hidden=false;
  b.onclick=async()=>{
    b.disabled=true;b.textContent='Preparing video\u2026';
    try{const r=await fetch('cpc-explainers-'+(isDark()?'dark':'light')+'.mp4');if(!r.ok)throw 0;
      await d.save({filename:'cpc-feature-explainers.mp4',data:await r.blob()});b.textContent='Saved'}
    catch(e){b.textContent=e&&e.code==='declined'?lab:'Could not save the video'}
    setTimeout(()=>{b.textContent=lab;b.disabled=false},2500)};
})();
addEventListener('hashchange',route);route();
</script>

</body></html>
